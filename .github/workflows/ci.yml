name: CI

on:
  push:
    branches: [main, feature]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: matching_db_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ci-test-secret-key
      DB_NAME: matching_db_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Check formatting (black)
        run: poetry run black --check backend/apps/ backend/config/

      - name: Check import order (isort)
        run: poetry run isort --check-only backend/apps/ backend/config/

      - name: Lint (flake8)
        run: |
          poetry run flake8 backend/apps/ backend/config/ \
            --max-line-length=100 \
            --extend-ignore=E203,W503 \
            --exclude=migrations,__pycache__,.venv,build,dist

      - name: Django system check
        working-directory: backend
        run: poetry run python manage.py check

      - name: Run tests with coverage
        run: poetry run pytest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: var/.coverage
          # upload-artifact는 기본적으로 숨김 파일(dotfile)을 제외하는데,
          # .coverage 자체가 숨김 파일이라 이게 없으면 파일이 실제로 있어도
          # "No files were found"로 스킵된다.
          include-hidden-files: true

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Build
        run: npm run build
