# Run with:
#   docker compose --env-file .envs/.env.prod -f docker-compose.prod.yml up -d --build
#
# --env-file is required so DB_NAME/DB_USER/DB_PASSWORD from .envs/.env.prod
# are available for the ${...} substitutions below (env_file: alone only
# injects vars into a container, it does not feed compose-file interpolation).
#
# Building on Apple Silicon for an amd64 server? Add --platform linux/amd64
# to the `docker compose ... build` step (some arm64 wheels SIGILL under
# Docker Desktop's Apple Silicon VM).
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - .envs/.env.prod
    environment:
      # The bundled db/redis services above are reachable as "db"/"redis",
      # regardless of whatever host .envs/.env.prod points at for non-Docker
      # deployments.
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        # 런타임 환경변수가 아니라 빌드 ARG인 이유는 Dockerfile.frontend 주석 참고
        # — 값을 바꾸면 컨테이너 재시작이 아니라 `up --build`로 다시 빌드해야 함.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
    restart: unless-stopped
    ports:
      - "3000:80"

volumes:
  pgdata_prod:
