name: matching-api

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: matching_db
      POSTGRES_USER: matching
      POSTGRES_PASSWORD: matching
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matching -d matching_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    # Some arm64 wheels (e.g. rpds-py) SIGILL under Docker Desktop's Apple
    # Silicon VM; amd64 (via Rosetta/QEMU) builds and runs reliably instead.
    platform: linux/amd64
    volumes:
      - ./backend:/app/backend
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: dev-secret-key-not-for-production
      DB_NAME: matching_db
      DB_USER: matching
      DB_PASSWORD: matching
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      target: dev
    volumes:
      - ./frontend:/app
      # 익명 볼륨으로 위 바인드 마운트가 이미지 안에 설치된 node_modules를
      # 가리지 않게 한다 — 안 하면 컨테이너 안에 아무 것도 안 깔린
      # 호스트의 (아마 비어있는) node_modules가 그대로 보이게 됨.
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      # CORS_ALLOWED_ORIGINS/FRONTEND_URL 기본값(base.py)이 이미
      # http://localhost:3000이라 web 쪽은 따로 맞출 게 없다.
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - web

volumes:
  pgdata_dev:
