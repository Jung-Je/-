services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: matching_db
      POSTGRES_USER: matching
      POSTGRES_PASSWORD: matching
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matching -d matching_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    # Some arm64 wheels (e.g. rpds-py) SIGILL under Docker Desktop's Apple
    # Silicon VM; amd64 (via Rosetta/QEMU) builds and runs reliably instead.
    platform: linux/amd64
    volumes:
      - ./backend:/app/backend
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: dev-secret-key-not-for-production
      DB_NAME: matching_db
      DB_USER: matching
      DB_PASSWORD: matching
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata_dev:
