# react-router가 클라이언트 사이드에서 라우팅하므로(/matching, /messages/:id
# 등), 그 경로를 새로고침하거나 직접 열면 실제로는 그런 파일이 없어 nginx가
# 기본 404를 낸다 — try_files로 없는 경로는 전부 index.html로 넘겨서
# react-router가 대신 처리하게 한다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
