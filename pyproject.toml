[project]
name = "matching-api"
version = "0.1.0"
description = "Headless Matching API Server with automated documentation"
authors = [{ name = "Your Name", email = "your.email@example.com" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dynamic = ["dependencies"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.0"
djangorestframework = "^3.14"
django-environ = "^0.11.2"
psycopg2-binary = "^2.9"
drf-spectacular = "^0.27.0"
django-cors-headers = "^4.3.1"
django-filter = "^24.0"
pillow = "^10.2.0"
gunicorn = "^21.2.0"
whitenoise = "^6.12.0"
django-axes = "^8.3.1"
django-redis = "^7.0.0"

[tool.poetry.group.dev.dependencies]
black = "^24.1.0"
flake8 = "^7.0.0"
isort = "^5.13.0"
pytest = "^8.0.0"
pytest-django = "^4.8.0"
pytest-cov = "^4.1.0"
factory-boy = "^3.3.0"
faker = "^22.0.0"
pre-commit = "^3.6.0"
django-debug-toolbar = "^4.3.0"
ipython = "^8.20.0"
django-extensions = "^4.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["*/migrations/*"]
known_first_party = ["apps", "config"]
known_django = ["django", "rest_framework"]
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
pythonpath = ["backend"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--cov=apps --cov=config --cov-report=html:var/htmlcov --cov-report=term-missing"
# 테스트 산출물(커버리지, 캐시)을 var/ 한 곳에 모아서 관리
cache_dir = "var/.pytest_cache"

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests.py", "*/test_*.py"]
data_file = "var/.coverage"

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]
