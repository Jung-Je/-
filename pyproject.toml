[tool.poetry]
name = "matching-api"
version = "0.1.0"
description = "Headless Matching API Server with automated documentation"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.0"
djangorestframework = "^3.14"
django-environ = "^0.11.2"
psycopg2-binary = "^2.9"
drf-spectacular = "^0.27.0"
django-cors-headers = "^4.3.1"
django-filter = "^24.0"
pillow = "^10.2.0"
gunicorn = "^21.2.0"

[tool.poetry.group.dev.dependencies]
black = "^24.1.0"
flake8 = "^7.0.0"
isort = "^5.13.0"
pytest = "^8.0.0"
pytest-django = "^4.8.0"
pytest-cov = "^4.1.0"
factory-boy = "^3.3.0"
faker = "^22.0.0"
pre-commit = "^3.6.0"
django-debug-toolbar = "^4.3.0"
ipython = "^8.20.0"
django-extensions = "^4.1"
whitenoise = "^6.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["*/migrations/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--cov=backend --cov-report=html --cov-report=term-missing"
